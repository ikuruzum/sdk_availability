group 'com.ikuruzum.sdk_availability'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.21'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ikuruzum.sdk_availability'
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        
        // Manifest placeholders to handle permissions
        manifestPlaceholders = [
            'appAuthRedirectScheme': 'com.ikuruzum.sdk_availability',
            'excludeSystemAlertWindow': 'true',
            'excludeInstallPackages': 'true'
        ]
    }
    
    // This ensures the ProGuard rules are included in the published AAR
    buildTypes {
        release {
            // Include the ProGuard rules in the published AAR
            consumerProguardFiles 'consumer-proguard-rules.pro'
        }
        debug {
            // Include the ProGuard rules in the published AAR for debug builds too
            consumerProguardFiles 'consumer-proguard-rules.pro'
        }
    }
    
    // For library projects, we need to handle the manifest differently
    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            output.processManifestProvider.get().doLast {
                def manifestFile = new File("${buildDir}/intermediates/packaged_manifests/${variant.name}/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def xml = new XmlSlurper().parse(manifestFile)
                    def usesPermissions = xml.'uses-permission'
                    usesPermissions.each { perm ->
                        if (perm.'@android:name'.text().contains('INSTALL_PACKAGES')) {
                            def parent = perm.parent()
                            parent.remove(perm)
                        }
                    }
                    def writer = new FileWriter(manifestFile)
                    def printer = new XmlNodePrinter(new PrintWriter(writer))
                    printer.preserveWhitespace = true
                    printer.print(xml)
                }
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.huawei.hms:base:5.2.0.300'
}
