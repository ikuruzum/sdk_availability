name: sdk_availability
description: A Flutter plugin to detect the availability of the Google Play Services and Huawei HMS Services API on Android devices.
version: 1.3.0
homepage: 'https://github.com/ikuruzum/sdk_availability'
repository: 'https://github.com/ikuruzum/sdk_availability'

environment:
  sdk: ">=2.16.2 <3.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    implements: sdk_availability
    platforms:
      android:
        package: com.ikuruzum.sdk_availability
        pluginClass: SDKAvailabilityPlugin